openapi: 3.0.3
info:
  title: Rule fixture
  version: 1.0.0
paths:
  /items:
    get:
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  metadata:
                    oneOf:
                      - type: string
                      - type: integer
